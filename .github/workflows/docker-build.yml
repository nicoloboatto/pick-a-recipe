
# Build & push the Docker image to GHCR (GitHub Container Registry).
#
# On every push to main:
#   1. Build the image (linux/amd64) on a GitHub-hosted runner.
#   2. Push it to ghcr.io/<owner>/<repo> as :latest and :sha-<short-sha>.
#
# No repository secrets required — GHCR auth uses the automatically
# generated GITHUB_TOKEN.
#
# First-time setup:
#   - After the first successful run, the package will exist at
#     https://github.com/users/<owner>/packages/container/package/<repo>
#     (or /orgs/<owner>/... for an org). It's private by default.
#   - To `docker pull` from Unraid without logging in, open the package's
#     settings there and change visibility to Public.
#   - To keep it private instead, run `docker login ghcr.io` on Unraid with
#     a GitHub Personal Access Token (classic, `read:packages` scope) as the
#     password and your GitHub username as the username.
#
# See UNRAID.md for the full pull/run instructions.

name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-build-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # amd64 only: Unraid runs on x86_64. GitHub-hosted runners build amd64
      # natively (no QEMU emulation needed), so this is fast without needing
      # a self-hosted runner.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
